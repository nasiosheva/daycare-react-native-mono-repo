name: Deploy production

on:
  push:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  detect-api-changes:
    name: Detect API changes
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.changes.outputs.api_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git show --format= --name-only "$AFTER_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          fi

          if printf '%s\n' "$changed_files" | grep -q '^apps/api/'; then
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: detect-api-changes
    env:
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_API_URL: ${{ vars.PRODUCTION_API_URL || secrets.PRODUCTION_API_URL }}
      EXPO_PUBLIC_REALTIME_URL: ${{ vars.PRODUCTION_REALTIME_URL || secrets.PRODUCTION_REALTIME_URL }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.PRODUCTION_FIREBASE_API_KEY || secrets.PRODUCTION_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PRODUCTION_FIREBASE_AUTH_DOMAIN || secrets.PRODUCTION_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PRODUCTION_FIREBASE_PROJECT_ID || secrets.PRODUCTION_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.PRODUCTION_FIREBASE_APP_ID || secrets.PRODUCTION_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.PRODUCTION_GOOGLE_WEB_CLIENT_ID || secrets.PRODUCTION_GOOGLE_WEB_CLIENT_ID }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || secrets.VPS_APP_DIR }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Java
        if: needs.detect-api-changes.outputs.api_changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle cache
        if: needs.detect-api-changes.outputs.api_changed == 'true'
        uses: gradle/actions/setup-gradle@v4
      - name: Validate deployment configuration
        run: |
          test -n "$EXPO_PUBLIC_API_URL"
          test -n "$EXPO_PUBLIC_FIREBASE_API_KEY"
          test -n "$EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN"
          test -n "$EXPO_PUBLIC_FIREBASE_PROJECT_ID"
          test -n "$EXPO_PUBLIC_FIREBASE_APP_ID"
          test -n "$VPS_APP_DIR"
          test -n "$VPS_HOST"
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_USER"
      - run: corepack pnpm install --frozen-lockfile
      - name: Build web release
        run: corepack pnpm --filter @daycare/app exec expo export --platform web
      - name: Test API
        if: needs.detect-api-changes.outputs.api_changed == 'true'
        run: ./apps/api/gradlew -p apps/api test --no-daemon
      - name: Build API release
        if: needs.detect-api-changes.outputs.api_changed == 'true'
        run: ./apps/api/gradlew -p apps/api bootJar --no-daemon
      - name: Configure deploy SSH identity
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload immutable release
        env:
          RELEASE_ID: ${{ github.sha }}
          API_CHANGED: ${{ needs.detect-api-changes.outputs.api_changed }}
        run: |
          release_directory="$VPS_APP_DIR/releases/$RELEASE_ID"
          ssh "$VPS_USER@$VPS_HOST" "install -d -m 755 '$release_directory/web'"
          rsync -az --delete apps/mobile/dist/ "$VPS_USER@$VPS_HOST:$release_directory/web/"
          if [[ "$API_CHANGED" == "true" ]]; then
            api_jar="$(find apps/api/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
            test -n "$api_jar"
            rsync -az "$api_jar" "$VPS_USER@$VPS_HOST:$release_directory/api.jar"
          fi
      - name: Activate release
        id: activate-release
        continue-on-error: ${{ needs.detect-api-changes.outputs.api_changed == 'true' }}
        env:
          RELEASE_ID: ${{ github.sha }}
        run: ssh "$VPS_USER@$VPS_HOST" "sudo /usr/local/sbin/umur-emas-activate-release '$RELEASE_ID'"
      - name: Verify API health
        id: verify-api-health
        if: needs.detect-api-changes.outputs.api_changed == 'true' && steps.activate-release.outcome == 'success'
        continue-on-error: true
        run: |
          for attempt in {1..18}; do
            if ssh "$VPS_USER@$VPS_HOST" "curl --silent --fail http://127.0.0.1:8080/api/actuator/health | grep -q '\"status\":\"UP\"'"; then
              exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy after deployment." >&2
          exit 1
      - name: Roll back failed API release
        if: needs.detect-api-changes.outputs.api_changed == 'true' && (steps.activate-release.outcome == 'failure' || steps.verify-api-health.outcome == 'failure')
        run: |
          ssh "$VPS_USER@$VPS_HOST" "sudo /usr/local/sbin/umur-emas-activate-release --rollback"
          for attempt in {1..18}; do
            if ssh "$VPS_USER@$VPS_HOST" "curl --silent --fail http://127.0.0.1:8080/api/actuator/health | grep -q '\"status\":\"UP\"'"; then
              exit 0
            fi
            sleep 10
          done
          echo "Rollback API did not become healthy." >&2
          exit 1
      - name: Mark failed API release
        if: needs.detect-api-changes.outputs.api_changed == 'true' && (steps.activate-release.outcome == 'failure' || steps.verify-api-health.outcome == 'failure')
        run: exit 1
