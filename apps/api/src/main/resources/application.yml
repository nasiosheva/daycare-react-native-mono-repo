spring:
  application:
    name: daycare-api
  messages:
    basename: i18n/errors
    fallback-to-system-locale: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/daycare}
    username: ${POSTGRES_USER:daycare}
    password: ${POSTGRES_PASSWORD:daycare}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FIREBASE_ISSUER_URI}
server:
  servlet:
    context-path: /api
daycare:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://127.0.0.1:19006}
  platform-admin-emails: ${PLATFORM_ADMIN_EMAILS:}
  local-auth-enabled: ${LOCAL_AUTH_ENABLED:false}
  local-auth-jwt-secret: ${LOCAL_AUTH_JWT_SECRET:}
  local-seed-enabled: ${LOCAL_SEED_ENABLED:false}
  local-seed-admin-email: ${LOCAL_SEED_ADMIN_EMAIL:admin@local.test}
  local-seed-admin-username: ${LOCAL_SEED_ADMIN_USERNAME:admin}
  local-seed-admin-display-name: ${LOCAL_SEED_ADMIN_DISPLAY_NAME:Local Admin}
  local-seed-admin-password: ${LOCAL_SEED_ADMIN_PASSWORD:admin@local.test}
  seed-global-curriculum-enabled: ${SEED_GLOBAL_CURRICULUM_ENABLED:false}
  firebase-service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  qr-signing-secret: ${QR_SIGNING_SECRET:replace-this-development-secret-with-at-least-32-characters}
  expo-push-url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
springdoc:
  api-docs:
    path: /v3/api-docs
