services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daycare}
      POSTGRES_USER: ${POSTGRES_USER:-daycare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daycare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
